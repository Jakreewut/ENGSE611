<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Grade</title>

    <style>
        body { font-family: sans-serif; padding: 20px; }
        #output { 
            background-color: #1a1a1a; 
            color: #fff; 
            padding: 10zpx; 
            border-radius: 8px; 
            white-space: pre-line;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="output">ตรงนี้</div>
    <button onclick="runDemo()">Run code</button>
    <script>
        function runDemo() {
            let score = 57;
            let grade = "";
            let status = "";
            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            if (score >= 50) {
                status = "ผ่าน";
            } else {
                status = "ไม่ผ่าน";
            }

            const  result = `คะแนนที่ได้ : ${score} \n เกรด : ${grade} \n สถานะ : ${status}`;

            console.log(result);

            document.getElementById("output").innerText = result;

        }
    </script>
</body>
</html>
