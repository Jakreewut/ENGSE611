<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Practice</title>

    <style>
        body { font-family: sans-serif; padding: 20px; }
        #output { 
            background-color: #000000; 
            color: #ffffff; 
            padding: 10px; 
            border-radius: 8px; 
            white-space: pre-line;
            margin-top: 8px;
            box-shadow: 0 8px 10px rgba(255, 252, 48, 0.959);
        }
    </style>
</head>
<body>
    <button onclick="runDemo()">Run code</button>
    <div id="output">ตรงนี้...</div>

    <script>
        function runDemo() {
            let output = "";
            let maxNum = Math.floor(Math.random() * 30.1);
            for (let i = 0; i <= maxNum; i++) {
                if (i % 2 === 0) {
                    out += `${i} เป็นเลขคู่\n`;
                } else {
                    out += `${i} เป็นเลขคี่\n`;
                }
            }

            let loopResult = "";
            for (let i = 0; i <= maxNum; i += 2) {
                loopResult += `นับทีละ 2: ${i}\n`;
            }
            for (let j = maxNum; j >= 0; j--) {
                loopResult += `ถอยหลัง: ${j}\n`;
            }

            const result = `จำนวนสูงสุดที่สุ่มได้: ${maxNum}\n\n` + out + `\nผลลัพธ์การนับทีละ 2 และถอยหลัง\n${loopResult}`;
            console.log(result);
            document.getElementById("output").innerText = result;
        }
    </script>
   
</body>
</html>
