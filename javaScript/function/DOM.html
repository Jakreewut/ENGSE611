<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom</title>
     <style>
        body {
            font-family: "Prompt", sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #header {
            color: darkblue;
        }

        .item {
            padding: 4px 0;
        }

        .highlight {
            background: yellow;
        }

        button {
            padding: 8px 16px;
            margin: 4px 4px 10px 0;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: #00bfff;
            color: white;
            font-size: 14px;
        }

        button:hover {
            background: #0095d6;
        }

        #logBox {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #fff;
            border-left: 4px solid #00d26a;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1 id="header">หัวข้อเดิม</h1>
    <p>รายการตัวอย่าง (class = "item"):</p>

    <ul>
        <li class="item">รายการตัวอย่าง 1</li>
        <li class="item">รายการตัวอย่าง 2</li>
        <li class="item">รายการตัวอย่าง 3</li>
    </ul>

    <div style="margin-top: 20px; margin-bottom: 20px;">
        <button onclick="changeTitle()">เปลี่ยนหัวข้อ + เปลี่ยนสีพื้นหลัง</button>
        <button onclick="HighlightItem()">ไฮไลต์ .item  ทั้งหมด</button>
        <button onclick="addParagraph()">สร้าง และ เพิ่ม Paragraph</button>
    </div>

    <div id="logBox">Log: รอกดปุ่มเพื่อดูผลลัพธ์</div>

    <script>
        const title = document.getElementById("header");
        const item = document.querySelectorAll(".item");
        const logBox = document.getElementById("logBox");

        function log(message) {
            console.log(message);
            logBox.textContent += "\n" + message;
        }

        function changeTitle() {
            title.textContent = "หัวข้อถูกเปลี่ยนโดย JavaScript";
            title.style.color = "red";
            title.style.fontWeight = "bold";
            log("เปลี่ยนหัวข้อและสีพื้นหลังของ Header แล้ว");
        }

        function HighlightItem() {
            item.forEach((item, index) => {
                item.classList.add("highlight");
                item.textContent = "รายการตัวอย่าง " + (index + 1) + " (ถูกไฮไลต์)";
            });
            log("เพิ่มคลาส 'highlight' ให้กับ .item ทั้งหมด และเปลี่ยนข้อความ");
        }

        function addParagraph() {
            let p = document.createElement("p");
            p.textContent = "นี่คือข้อความใหม่ที่เพิ่มจาก JavaScript เวลา: " + new Date().toLocaleTimeString();
            document.body.appendChild(p);
            log("สร้าง Paragraph ใหม่และ appenChild ลงท้าย body แล้ว");
        }
    </script>
</body>
</html>
