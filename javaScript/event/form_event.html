<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        input[type="text"] {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- ตัวอย่างการใช้ focus และ blur event กับ input field -->
    <div class="container">
        <input type="text" id="username" placeholder="Username ต้องมี 3+ ตัวอักษร">
    </div>

    <!-- JavaScript สำหรับจัดการ focus และ blur event -->
    <script>
        let user = document.getElementById("username");

        // เมื่อ input ได้รับ focus จะเปลี่ยนสีพื้นหลัง
        username.addEventListener('focus', function() {
            this.style.backgroundColor = "#e0f7fa";
        });

        // เมื่อ input สูญเสีย focus จะตรวจสอบความยาวของข้อความและเปลี่ยนสีขอบตามเงื่อนไข
        username.addEventListener('blur', function() {
            this.style.backgroundColor = "";
            
            if (this.value.length < 3) {
                this.style.borderColor = "red";
            } else {
                this.style.borderColor = "green";
            }
        });
    </script>
</body>
</html>
