<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* mobile first */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            background: #e9edf2;
            padding: 5px;
            border-radius: 10px;
        }

        .item {
            background: #0f2557;
            color: #ffffff;
            height: 50px;
            display: flex;
            align-items: center;
            font-size: 18px;
            border-radius: 8px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* on labpot */
        @media (min-width: 760px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
            p {
                font-size: 16px;
            }
        }

        /* on pc */
         @media (min-width: 1024) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
                max-width: 1200px;
                margin: 0 auto;
            }
            p {
                font-size: 18px;
            }
         }

    </style>
</head>

<body>
    <h1>Grid & Responsive</h1>
    <p>hdjdslkjsdlds</p>

    <div class="grid-container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
