<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
       
        /* ปกติ*/
        .flexbox-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #e9edf2;
            border-radius: 10px;
        }

        .item {
            background: #0f2557;
            color: #ffffff;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border-radius: 8px;
        } 

         
    </style>
</head>
<body>
    <h1>Flexbox & Responsive</h1>

    <div class="flexbox-container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
</body>
</html>
