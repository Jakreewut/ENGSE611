<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style> 
        /* mobile first */
        :root {
            --padding: 16px;
            --background-color: #f4f6f8;
            --card-background: #ffffff;
            --text-color: #1f2933;
        }
        /* ปรับค่าเมื่อหน้าจอใหญ่ขึ้น */
        @media (min-width: 768px) {
            :root {
                --padding: 32px;
            }
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: var(--br-color);
            color: var(--text-color);
        }

        /* container ใช้ CSS */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--padding);
        }

        .card {
            background: var(--card-background);
            padding: var(--padding);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Clamp ver. Typography */
        h1 {
            font-size: clamp(1.6rem, 4vw, 2.8rem);
            margin-top: 0;
        }

        p {
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Modern CSS</h1>

            <p>
                ตัวอย่างนี้แสดงการใชเ CSS variables และฟังก์ชัน clamp()
            </p>

            <p>
                เมื่อขยายหรือย่อหน้าจอ จะเห็นว่ามันเปลี่ยน
            </p>
        </div>
    </div>
</body>
</html>
