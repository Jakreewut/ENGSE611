<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>

    <style>
        body {
            margin: 0;
            font-family: Tahoma;
            background: #f5f5f5;
        }

        header {
            background: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 15px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        nav a {
            background: #34495e;
            color: #ffffff;
            text-align: none;
            border-radius: 5px;
        }

        main {
            padding: 15px;
        }

        .card {
            background: #ffffff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgbd(0,0,0,0.1);
        }

        footer {
            background: #dddddd;
            text-align: center;
            padding: 10px;
            font-size: 14px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

    </style>
</head>
<body>
    <header>
        <h1>Mobile-First</h1>
        <p>เริ่มออกแบบจากมือถือ</p>

        <nav>
            <a href="#">หน้าแรก</a>
            <a href="#">เกี่ยวกับ</a>
            <a href="#">บทเรียน</a>
            <a href="#">ติดต่อ</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h3>แนวคิด Mobile-First</h3>
            <p>บลาๆๆๆๆ</p>
            
        </div>

        <div class="card">
                <h3>ข้อดี</h3>
                <ul>
                    <li>เว็บโหลดเร็ว</li>
                    <li>เหมาะกับมือถือ</li>
                    <li>โค้ดเป็นระเบียบ</li>
                </ul>
        </div>

        <div class="card">
            <h3>ใช้งานได้จริง</h3>
            <p>
                ใช้ร่วมกับ Responsive Design ได้ และเป็นมาตรฐานปัจจุบัน
            </p>
        </div>
      
        <img src="photo/Screenshot 2568-12-09 at 14.49.59.png" alt="Screenshot">

    </main>

    <footer>
        Jakreewut Sookkhammeung
    </footer>
</body>
</html>
